<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOMSU AIM</title><style>body{margin:0;background:#07111d;color:#fff;font-family:Arial;overflow:hidden}#game{height:100vh;position:relative;background:radial-gradient(circle at center,#274b68,#07111d)}#target{position:absolute;width:180px;height:180px;border-radius:50%;background:url('targets/target1.jpg') center/cover;cursor:crosshair;border:7px solid #ffd21a;box-shadow:0 0 30px #ffd21a;transition:width .12s,height .12s}#hud{position:fixed;top:15px;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:12px}.pill{background:#081625dd;border:2px solid #ffd21a;border-radius:13px;padding:10px 18px;font-weight:bold}.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;background:#07111ddd}.screen h1{font-size:clamp(48px,10vw,90px);margin:0;color:#ffd21a;font-style:italic;text-shadow:0 6px #704400}.screen button{border:0;background:#ffd21a;border-radius:16px;padding:17px 60px;font-size:28px;font-weight:1000;cursor:pointer}.hidden{display:none}.hit{position:absolute;color:#ffd21a;font-size:28px;font-weight:bold;animation:pop .5s forwards;pointer-events:none}@keyframes pop{to{transform:translateY(-60px);opacity:0}}@media(max-width:600px){#target{width:130px;height:130px}.pill{padding:8px 11px}}</style></head><body><div id="game"><div id="hud" class="hidden"><div class="pill">🎯 Score <b id="score">0</b></div><div class="pill">⏱️ <b id="time">30</b></div><div class="pill">🏆 <b id="best">0</b></div></div><div id="menu" class="screen"><div><h1>SOMSU AIM</h1><p>AIM • CLICK • BEAT YOUR BEST</p><button id="play">PLAY ▶</button></div></div><div id="over" class="screen hidden"><div><h1>GAME OVER</h1><p>Score: <b id="final">0</b></p><button id="retry">RETRY ↻</button></div></div><div id="target" class="hidden"></div></div><script>const g=document.querySelector('#game'),t=document.querySelector('#target'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best');let score=0,time=30,running=false,timer,moveTimer,best=+localStorage.somsuAimBest||0;bestEl.textContent=best;function place(){let r=g.getBoundingClientRect(),s=t.offsetWidth,x=10+Math.random()*(r.width-s-20),y=70+Math.random()*(r.height-s-90);t.style.left=x+'px';t.style.top=y+'px'}function start(){score=0;time=30;running=true;document.querySelector('#menu').classList.add('hidden');document.querySelector('#over').classList.add('hidden');document.querySelector('#hud').classList.remove('hidden');t.classList.remove('hidden');place();clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000);clearInterval(moveTimer);moveTimer=setInterval(place,1400)}function end(){if(!running)return;running=false;clearInterval(timer);clearInterval(moveTimer);t.classList.add('hidden');best=Math.max(best,score);localStorage.somsuAimBest=best;bestEl.textContent=best;document.querySelector('#final').textContent=score;document.querySelector('#over').classList.remove('hidden');document.querySelector('#hud').classList.add('hidden')}t.onclick=e=>{if(!running)return;e.stopPropagation();score+=10;scoreEl.textContent=score;let h=document.createElement('span');h.className='hit';h.textContent='+10';h.style.left=t.offsetLeft+'px';h.style.top=t.offsetTop+'px';g.appendChild(h);setTimeout(()=>h.remove(),500);place();if(score%50===0){t.style.width=Math.max(70,t.offsetWidth-12)+'px';t.style.height=t.style.width}};document.querySelector('#play').onclick=start;document.querySelector('#retry').onclick=start;g.onclick=e=>{if(running&&e.target===g){score=Math.max(0,score-5);scoreEl.textContent=score}};addEventListener('resize',()=>running&&place())</script></body></html>
